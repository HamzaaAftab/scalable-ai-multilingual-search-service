[project]
name = "blinkit-search-backend"
version = "0.1.0"
description = "Multilingual search at scale: API + Kafka workers"
requires-python = ">=3.12"
# Versions pin hain, taake kal "pip install" se koi naya version aa kar code na tod de
dependencies = [
    # [standard] = uvicorn (server) + "fastapi dev" command bhi saath aate hain
    "fastapi[standard]==0.162.0",
    "groq==1.7.0",
    "python-dotenv==1.2.4",
]

# src/ ke andar ke folders hamare packages hain: "from common.config import settings" kahin se bhi chale
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common", "src/api"]
